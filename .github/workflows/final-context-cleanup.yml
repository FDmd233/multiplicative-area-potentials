name: Final context cleanup

on:
  push:
    paths:
      - '.github/workflows/final-context-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove submission-process note
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('paper/main.tex')
          s=p.read_text(encoding='utf-8')
          s=s.replace('% Replace the anonymous author line before submission.\n','')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/conversation-trace-audit.yml .github/workflows/final-context-cleanup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove submission-process note'
          git push
